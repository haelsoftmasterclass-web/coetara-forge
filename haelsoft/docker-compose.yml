# Local PostgreSQL for development: `docker compose up -d` from the haelsoft/ folder.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: haelsoft
      POSTGRES_PASSWORD: haelsoft
      POSTGRES_DB: haelsoft
    ports:
      - "5432:5432"
    volumes:
      - haelsoft-db:/var/lib/postgresql/data

volumes:
  haelsoft-db:
