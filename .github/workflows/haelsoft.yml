name: Haelsoft EdTech

on:
  push:
    paths: ["haelsoft/**", ".github/workflows/haelsoft.yml"]
  pull_request:
    paths: ["haelsoft/**", ".github/workflows/haelsoft.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haelsoft/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: haelsoft
          POSTGRES_PASSWORD: haelsoft
          POSTGRES_DB: haelsoft
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haelsoft" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://haelsoft:haelsoft@localhost:5432/haelsoft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: haelsoft/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate
      - run: python manage.py test
      - name: Production settings check
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: api.example.org

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haelsoft/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: haelsoft/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://haelsoft.example
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
